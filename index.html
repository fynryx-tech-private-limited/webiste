<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags (Dynamic - managed by react-helmet-async) -->
    <title>Fynryx – Design. Innovate. Transform.</title>
    <meta name="description" content="Fynryx — IT services including web development, mobile apps, cloud computing, and managed IT support. Design. Innovate. Transform.">
    <meta name="keywords" content="Fynryx, web development, IT services, mobile apps, cloud computing, managed IT support, software development">
    <meta name="author" content="Fynryx">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    
    <!-- Canonical URL (Dynamic - managed by react-helmet-async) -->
    <link rel="canonical" href="https://fynryx.com" />
    
    <!-- Open Graph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fynryx.com/" />
    <meta property="og:title" content="Fynryx – Design. Innovate. Transform." />
    <meta property="og:description" content="Professional IT services: web development, mobile apps, cloud computing, and managed IT support." />
    <meta property="og:image" content="https://fynryx.com/og-image.png" />
    <meta property="og:site_name" content="Fynryx" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fynryx.com/" />
    <meta property="twitter:title" content="Fynryx – Design. Innovate. Transform." />
    <meta property="twitter:description" content="Professional IT services: web development, mobile apps, cloud computing, and managed IT support." />
    <meta property="twitter:image" content="https://fynryx.com/og-image.png" />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Fynryx",
      "description": "Professional IT services company providing web development, mobile apps, cloud computing, and managed IT support.",
      "url": "https://fynryx.com",
      "logo": "https://fynryx.com/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Support",
        "email": "contact@fynryx.com"
      },
      "sameAs": [
        "https://www.linkedin.com/company/fynryx",
        "https://twitter.com/fynryx",
        "https://www.facebook.com/fynryx"
      ]
    }
    </script>
    
    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
